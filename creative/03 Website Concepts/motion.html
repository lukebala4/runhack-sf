<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Running Hackathon — Morning runner</title><link rel="icon" href="assets/running-hackathon-wordmark.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><style>
body{max-width:1200px;margin:auto;padding:30px 40px}header{display:flex;justify-content:space-between;align-items:center;font-size:14px}header img{width:150px}main{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:70px;min-height:80vh}h1{font-size:clamp(50px,6vw,86px);line-height:1.02;margin:25px 0}p{font-size:17px;max-width:460px}.runner-motion{width:min(100%,440px);margin:auto}.motion-stage{position:relative}.ground{height:1px;background:#c2c4b5;position:absolute;width:70%;bottom:14%;left:15%;opacity:.5;z-index:-1}.controls{display:flex;gap:25px;margin-top:32px;align-items:center;font-size:15px}.controls button{border:1px solid #a7aa9b;border-radius:30px;padding:11px 22px}.text-link{font-size:15px}footer{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:20px}a{text-underline-offset:4px}@media(max-width:650px){body{padding:24px}main{grid-template-columns:1fr;gap:12px;padding:50px 0 30px}h1{font-size:54px}.runner-motion{width:290px}footer{flex-direction:column}}
</style></head><body><header><a href="/runhack-sf/creative/04%20Creative%20Warehouse/" aria-label="Creative warehouse"><img src="assets/running-hackathon-wordmark.svg" alt="Running Hackathon"></a><a href="rive.html">Rive capability map ↗</a></header><main><div><h1>Meet you<br>out there.</h1><p>An understated running companion for the margins. Cream singlet, brick-orange shoes, a morning rhythm.</p><div class="controls"><button id="motion-toggle" aria-pressed="false">Pause motion</button><a class="text-link" href="./?concept=track">See it in the hero ↗</a></div></div><div class="motion-stage"><div class="runner-motion" data-rive-runner aria-hidden="true"><img src="assets/runner-rig.svg" alt="" width="360" height="420"><canvas></canvas></div><div class="ground" aria-hidden="true"></div></div></main><footer><span>Local motion study / San Francisco</span><a href="https://editor.rive.app/file/untitled/2659506" target="_blank" rel="noopener">Open the editable Rive scene ↗</a></footer><script type="module">
import { mountRunners } from './runner-motion.js';
const motion = mountRunners();
const button = document.getElementById('motion-toggle');
button.addEventListener('click', () => {const paused = button.getAttribute('aria-pressed') !== 'true'; button.setAttribute('aria-pressed',String(paused)); button.textContent = paused ? 'Resume motion' : 'Pause motion'; motion.setPaused(paused);});
addEventListener('pagehide',event=>{if(!event.persisted)motion.cleanup()});
</script></body></html>
